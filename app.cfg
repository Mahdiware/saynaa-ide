app = {
  name: "Saynaa IDE",
  package: "com.mahdiware.saynaaide",
  versionName: "1.0.0",
  versionCode: 1,
  icon: "icon.png"
}

android = {
  minSdk: 21,
  targetSdk: 34,
  orientation: "portrait",
  theme: "Theme.Material.Light",
}

build = {
  main: "main.saynaa",
  output: "MyApplication.apk",
  debug: "true",
}

permissions = {
  "INTERNET",
  "WRITE_EXTERNAL_STORAGE",
}